<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Ar</title>
  <meta name="description" content="Photo Ar — منصة صور لأصحابك. اكتشف وشارك ونزّل.">
  <meta name="theme-color" content="#121110">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff7a1a'/%3E%3Cpath d='M9 12.5h2.6l1.2-2h6.4l1.2 2H23a1 1 0 0 1 1 1V22a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-8.5a1 1 0 0 1 1-1Z' fill='%23121110'/%3E%3Ccircle cx='16' cy='17.5' r='3.6' fill='%23ff7a1a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="logo" href="./" aria-label="Photo Ar">
    <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="var(--accent)"/>
      <path d="M9 12.5h2.6l1.2-2h6.4l1.2 2H23a1 1 0 0 1 1 1V22a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-8.5a1 1 0 0 1 1-1Z" fill="#121110"/>
      <circle cx="16" cy="17.5" r="3.6" fill="var(--accent)"/>
    </svg>
    <span class="logo-text">Photo <b>Ar</b></span>
  </a>

  <form class="search" id="search-form" role="search" autocomplete="off">
    <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 19a8 8 0 1 1 5.3-14A8 8 0 0 1 11 19Zm10 2-4.6-4.6"/></svg>
    <input id="q" type="search" data-i18n-ph="searchPh" maxlength="80" enterkeyhint="search">
  </form>

  <div class="actions">
    <button id="btn-upload" class="btn primary" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="upload"></span>
    </button>
    <button id="btn-lang" class="btn ghost" type="button" aria-label="Language"></button>
    <div id="auth-area" class="auth-area"></div>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button class="tab active" data-view="home" type="button" data-i18n="home"></button>
  <button class="tab" data-view="mine" type="button" hidden data-i18n="mine"></button>
  <button class="tab" data-view="review" type="button" hidden><span data-i18n="review"></span><i id="pending-count" class="count" hidden></i></button>
</nav>

<main>
  <div id="result-bar" class="result-bar" hidden></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden></div>
  <div id="sentinel" aria-hidden="true"></div>
  <div id="loader" class="loader" hidden><span></span><span></span><span></span></div>
</main>

<!-- ============ تسجيل الدخول ============ -->
<div class="modal" id="auth-modal" hidden>
  <div class="sheet auth-sheet" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <button class="x" type="button" data-close aria-label="Close">×</button>
    <h2 id="auth-title"></h2>
    <p class="sub" id="auth-sub"></p>

    <button id="btn-google" class="btn google" type="button">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      <span data-i18n="google"></span>
    </button>
    <div class="or"><span data-i18n="or"></span></div>

    <form id="auth-form" novalidate>
      <label class="field" id="f-username" hidden>
        <span data-i18n="username"></span>
        <input id="a-username" type="text" maxlength="40" autocomplete="nickname">
      </label>
      <label class="field">
        <span data-i18n="email"></span>
        <input id="a-email" type="email" required autocomplete="email" dir="ltr">
      </label>
      <label class="field">
        <span data-i18n="password"></span>
        <input id="a-pass" type="password" required minlength="6" autocomplete="current-password" dir="ltr">
      </label>
      <p class="msg" id="auth-msg" role="alert" hidden></p>
      <button class="btn primary wide" id="auth-submit" type="submit"></button>
    </form>
    <p class="switch"><span id="auth-switch-text"></span> <button type="button" class="link" id="auth-switch"></button></p>
  </div>
</div>

<!-- ============ رفع صورة ============ -->
<div class="modal" id="upload-modal" hidden>
  <div class="sheet upload-sheet" role="dialog" aria-modal="true" aria-labelledby="up-title">
    <button class="x" type="button" data-close aria-label="Close">×</button>
    <h2 id="up-title" data-i18n="uploadTitle"></h2>

    <div class="up-grid">
      <div>
        <label class="drop" id="drop" tabindex="0">
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <img id="preview" alt="" hidden>
          <div class="drop-hint" id="drop-hint">
            <svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M12 16V5m0 0-4 4m4-4 4 4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            <strong data-i18n="dropHere"></strong>
            <small data-i18n="fileRules"></small>
          </div>
        </label>
      </div>
      <div class="up-fields">
        <label class="field">
          <span data-i18n="titleLabel"></span>
          <input id="up-title-in" type="text" maxlength="120" data-i18n-ph="titlePh">
        </label>
        <div class="field">
          <span data-i18n="tagsLabel"></span>
          <div class="tagbox" id="tagbox">
            <div id="chips" class="chips"></div>
            <input id="tag-in" type="text" maxlength="30" data-i18n-ph="tagsPh">
          </div>
          <small class="hint" data-i18n="tagsHint"></small>
        </div>
        <p class="msg" id="up-msg" role="alert" hidden></p>
        <button class="btn primary wide" id="up-submit" type="button" data-i18n="publish"></button>
        <small class="hint center" id="up-note"></small>
      </div>
    </div>
  </div>
</div>

<!-- ============ عرض صورة ============ -->
<div class="modal viewer" id="viewer" hidden>
  <div class="v-wrap" role="dialog" aria-modal="true" aria-labelledby="v-title">
    <button class="x" type="button" data-close aria-label="Close">×</button>
    <div class="v-media"><img id="v-img" alt=""></div>
    <aside class="v-side">
      <h2 id="v-title"></h2>
      <p class="v-by" id="v-by"></p>
      <div class="chips ro" id="v-tags"></div>
      <div class="v-actions" id="v-actions"></div>
    </aside>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
